# airflow.cfg

[core]
executor = LocalExecutor
load_examples = False
dags_folder = /opt/airflow/dags
sql_alchemy_conn = postgresql+psycopg2://admin:root@airflow_database:5432/airflow


[scheduler]
catchup_by_default = False
max_threads = 2

[webserver]
authenticate = True
auth_backend = airflow.www.security.auth_backend.DEFAULT
